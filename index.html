<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Встреча</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0B0E14;
      --card-bg: #131A23;
      --border: #2A3442;
      --accent: #6C5CE7;
      --accent-light: #A29BFE;
      --text: #FFFFFF;
      --text-muted: #8B95A9;
      --radius: 28px;
      --danger: #FF4D6D;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      max-width: 700px;
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    /* --- ШАПКА --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-online {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .dot-online {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    .btn-login {
      padding: 6px 18px;
      background: transparent;
      border: 1.5px solid var(--accent);
      border-radius: 30px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-login:active { transform: scale(0.95); background: var(--accent); }

    .avatar {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar:active { transform: scale(0.9); }

    /* --- ОСНОВНАЯ СЕТКА --- */
    .main {
      flex: 1;
      padding-top: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .section-title span { color: var(--text-muted); font-weight: 400; font-size: 15px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 16px;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }

    .card:active { transform: scale(0.96); }
    .card-icon { font-size: 28px; margin-bottom: 8px; }
    .card h3 { font-size: 15px; font-weight: 600; }
    .card p { font-size: 12px; color: var(--text-muted); margin: 0; }

    .card-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 8px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 20px;
    }

    /* --- ОВЕРЛЕЙ --- */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .overlay.active {
      display: flex;
      animation: overlayFade 0.3s ease;
    }

    @keyframes overlayFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* --- РАСКРЫТАЯ КАРТОЧКА --- */
    .expanded-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 36px;
      padding: 32px 28px;
      max-width: 500px;
      width: 100%;
      max-height: 85vh;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .overlay.active .expanded-card {
      transform: scale(1);
    }

    .expanded-close {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 28px;
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      transition: 0.2s;
      z-index: 10;
    }

    .expanded-close:active { transform: scale(0.8); color: #fff; }

    .expanded-icon { font-size: 56px; margin-bottom: 8px; }
    .expanded-title { font-size: 28px; font-weight: 700; }
    .expanded-desc {
      font-size: 16px;
      color: var(--text-muted);
      margin: 4px 0 20px 0;
    }

    .expanded-action {
      padding: 14px 24px;
      background: var(--accent);
      border: none;
      border-radius: 30px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
    }

    .expanded-action:active { transform: scale(0.96); }

    .card-tools {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .card-tools h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .tool-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .tool-row:last-child { border-bottom: none; }
    .tool-row .label { color: var(--text-muted); }
    .tool-row .value { font-weight: 500; }

    /* --- ОКНО-ПРЕДУПРЕЖДЕНИЕ --- */
    .warning-screen {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 32px 28px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .overlay.active .warning-screen {
      transform: scale(1);
    }

    .warning-icon { font-size: 56px; margin-bottom: 12px; }
    .warning-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .warning-text {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .warning-actions { display: flex; flex-direction: column; gap: 10px; }

    /* --- ФОРМА ВХОДА --- */
    .login-screen {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 36px;
      padding: 32px 28px;
      max-width: 580px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      -webkit-overflow-scrolling: touch;
    }

    .overlay.active .login-screen {
      transform: scale(1);
    }

    .login-close {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 28px;
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      transition: 0.2s;
      z-index: 10;
    }

    .login-close:active { transform: scale(0.8); color: #fff; }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-header .icon { font-size: 48px; margin-bottom: 8px; }
    .login-header h2 { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .login-header p { color: var(--text-muted); font-size: 14px; }

    .avatar-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .avatar-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.2s;
      overflow: hidden;
      position: relative;
    }

    .avatar-circle:hover { border-color: var(--accent); }
    .avatar-circle:active { transform: scale(0.95); }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .avatar-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* --- ФОРМА: СЕТКА ПОЛЕЙ --- */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .form-group {
      margin: 0;
      min-width: 0;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group label .optional {
      font-weight: 400;
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.6;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: 0.2s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
    }

    .form-group input:focus { border-color: var(--accent); }
    .form-group input::placeholder { color: var(--text-muted); opacity: 0.5; }

    .form-group input[type="date"] {
      min-height: 52px;
    }

    .form-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-primary {
      padding: 16px;
      background: var(--accent);
      border: none;
      border-radius: 16px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      padding: 16px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-secondary:active { background: var(--border); }

    /* --- ПРОФИЛЬ --- */
    .profile-screen {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 36px;
      padding: 32px 28px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .overlay.active .profile-screen {
      transform: scale(1);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #fff;
      margin: 0 auto 12px;
      overflow: hidden;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .profile-nick {
      font-size: 15px;
      color: var(--text-muted);
    }

    .profile-info {
      margin: 24px 0;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 15px;
    }

    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: var(--text-muted); }
    .info-row .value { font-weight: 500; }

    .info-row .link {
      color: var(--accent-light);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .info-row .link:active { opacity: 0.7; }

    /* --- ЗАГЛУШКА --- */
    .placeholder-content { text-align: center; padding: 20px 0; }
    .placeholder-content .big-icon { font-size: 64px; margin-bottom: 16px; }
    .placeholder-content h2 { font-size: 24px; margin-bottom: 8px; }
    .placeholder-content p { color: var(--text-muted); font-size: 15px; margin-bottom: 20px; }

    /* --- АДАПТИВ: ЛАНДШАФТ → СЕТКА 2 КОЛОНКИ --- */
    @media (orientation: landscape) and (min-width: 560px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
      .form-group.full {
        grid-column: 1 / -1;
      }
    }

    /* --- АДАПТИВ: МАЛЕНЬКИЕ ЭКРАНЫ --- */
    @media (max-width: 400px) {
      .grid { gap: 10px; }
      .card { padding: 14px; border-radius: 20px; }
      .card h3 { font-size: 13px; }
      .card p { font-size: 11px; }
      .expanded-card { padding: 24px 18px; }
      .expanded-title { font-size: 22px; }
      .expanded-icon { font-size: 44px; }
      .login-screen { padding: 24px 18px; max-width: 100%; }
      .login-header h2 { font-size: 22px; }
      .avatar-circle, .profile-avatar { width: 80px; height: 80px; }
      .profile-name { font-size: 20px; }
      .warning-screen { padding: 24px 18px; }
      .warning-icon { font-size: 44px; }
      .warning-title { font-size: 18px; }
      .warning-text { font-size: 14px; }
      .form-group input { font-size: 15px; padding: 12px 16px; }
    }

    /* --- АДАПТИВ: БОЛЬШИЕ ЭКРАНЫ --- */
    @media (min-width: 600px) {
      .grid { gap: 18px; }
      .card { padding: 24px; }
      .card h3 { font-size: 18px; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app">

  <header class="header">
    <span class="logo">📍 ВСТРЕЧА</span>
    <div class="header-right">
      <div class="status-online">
        <span class="dot-online"></span>
        <span>Онлайн</span>
      </div>
      <div id="authContainer">
        <button class="btn-login" id="loginBtn">🔑 Войти</button>
        <div class="avatar hidden" id="avatar"></div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="section-title">Чем займёмся? <span>выбери активность</span></div>
    <div class="grid">

      <div class="card" data-card="walk">
        <div class="card-icon">🚶</div>
        <h3>Прогуляться</h3>
        <p>Найди попутчика</p>
        <span class="card-badge">Активно</span>
      </div>

      <div class="card" data-card="dog">
        <div class="card-icon">🐕</div>
        <h3>Выгул собак</h3>
        <p>Друзья для питомца</p>
        <span class="card-badge">Скоро</span>
      </div>

      <div class="card" data-card="chat">
        <div class="card-icon">💬</div>
        <h3>Разговоры по душам</h3>
        <p>Анонимное общение</p>
        <span class="card-badge">Скоро</span>
      </div>

      <div class="card" data-card="random">
        <div class="card-icon">🎲</div>
        <h3>Случайная встреча</h3>
        <p>По интересам</p>
        <span class="card-badge">Новое</span>
      </div>

    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div id="overlayContent"></div>
</div>

<script>
  (function() {
    "use strict";

    const overlay = document.getElementById('overlay');
    const overlayContent = document.getElementById('overlayContent');
    const loginBtn = document.getElementById('loginBtn');
    const avatar = document.getElementById('avatar');

    let isLoggedIn = false;
    let currentUser = null;

    // --- ЗАГРУЗКА ---
    function loadState() {
      const saved = localStorage.getItem('meet_user');
      if (saved) {
        try {
          currentUser = JSON.parse(saved);
          if (currentUser && currentUser.name && currentUser.surname) {
            isLoggedIn = true;
            updateAuthUI();
          }
        } catch (e) { localStorage.removeItem('meet_user'); }
      }
    }

    function saveUser(user) {
      currentUser = user;
      isLoggedIn = true;
      localStorage.setItem('meet_user', JSON.stringify(user));
      updateAuthUI();
    }

    function updateAuthUI() {
      if (isLoggedIn && currentUser) {
        loginBtn.classList.add('hidden');
        avatar.classList.remove('hidden');
        if (currentUser.avatar) {
          avatar.innerHTML = `<img src="${currentUser.avatar}" alt="">`;
        } else {
          avatar.textContent = (currentUser.name || '?').charAt(0).toUpperCase();
        }
      } else {
        loginBtn.classList.remove('hidden');
        avatar.classList.add('hidden');
      }
    }

    // --- УТИЛИТЫ ---
    function generateNickname(name, surname, birthDate) {
      const translit = {
        'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y',
        'к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f',
        'х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'
      };
      function toLatin(str) {
        return str.toLowerCase().split('').map(ch => translit[ch] || ch).join('').replace(/[^a-z0-9]/g, '');
      }
      const n = toLatin(name) || 'user';
      const s = toLatin(surname) || '';
      if (birthDate) {
        const age = calculateAge(birthDate);
        if (age !== null) return `${n}_${s}_${age}`;
      }
      const random = Math.floor(1000 + Math.random() * 9000);
      return s ? `${n}_${s}_${random}` : `${n}_${random}`;
    }

    function calculateAge(birthDate) {
      if (!birthDate) return null;
      const today = new Date();
      const birth = new Date(birthDate);
      if (isNaN(birth.getTime())) return null;
      let age = today.getFullYear() - birth.getFullYear();
      const m = today.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
      return age >= 0 && age < 120 ? age : null;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      return `${day}.${month}.${d.getFullYear()}`;
    }

    function closeOverlay() {
      overlay.classList.remove('active');
      overlayContent.innerHTML = '';
    }

    // --- ПРЕДУПРЕЖДЕНИЕ ---
    function showWarning(callback) {
      overlayContent.innerHTML = `
        <div class="warning-screen">
          <div class="warning-icon">🔒</div>
          <div class="warning-title">Требуется профиль</div>
          <div class="warning-text">
            Чтобы пользоваться этой функцией, нужно заполнить профиль.<br>Это займёт минуту.
          </div>
          <div class="warning-actions">
            <button class="btn-primary" id="warningGo">🚪 Перейти к регистрации</button>
            <button class="btn-secondary" id="warningCancel">Отмена</button>
          </div>
        </div>
      `;
      overlay.classList.add('active');

      document.getElementById('warningGo').addEventListener('click', () => {
        closeOverlay();
        setTimeout(() => {
          if (callback) callback();
          else showLoginForm();
        }, 200);
      });

      document.getElementById('warningCancel').addEventListener('click', closeOverlay);
    }

    // --- ФОРМА ВХОДА ---
    function showLoginForm(callback, editMode = false) {
      const user = editMode && currentUser ? currentUser : {};

      overlayContent.innerHTML = `
        <div class="login-screen">
          <button class="login-close" id="loginClose">✕</button>
          <div class="login-header">
            <div class="icon">${editMode ? '✏️' : '🔐'}</div>
            <h2>${editMode ? 'Редактирование' : 'Создайте профиль'}</h2>
            <p>${editMode ? 'Измените свои данные' : 'Заполните основные поля'}</p>
          </div>

          <div class="avatar-upload">
            <div class="avatar-circle" id="avatarCircle">
              ${user.avatar 
                ? `<img src="${user.avatar}" alt="">` 
                : (user.name ? user.name.charAt(0).toUpperCase() : '👤')}
            </div>
            <div class="avatar-hint">Нажмите, чтобы загрузить фото</div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none;">
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label>Имя *</label>
              <input type="text" id="inputName" placeholder="Алексей" maxlength="30" value="${user.name || ''}">
            </div>

            <div class="form-group">
              <label>Фамилия *</label>
              <input type="text" id="inputSurname" placeholder="Иванов" maxlength="30" value="${user.surname || ''}">
            </div>

            <div class="form-group">
              <label>Никнейм *</label>
              <input type="text" id="inputNick" placeholder="alex_ivanov_25" maxlength="40" value="${user.nick || ''}">
            </div>

            <div class="form-group">
              <label>Дата рождения <span class="optional">(необязательно)</span></label>
              <input type="date" id="inputBirth" value="${user.birth || ''}">
            </div>

            <div class="form-group full">
              <label>Телефон <span class="optional">(необязательно)</span></label>
              <input type="tel" id="inputPhone" placeholder="+7 999 123-45-67" maxlength="20" value="${user.phone || ''}">
            </div>
          </div>

          <div class="form-actions">
            <button class="btn-primary" id="btnSave" disabled>${editMode ? 'Сохранить' : 'Войти'}</button>
            ${editMode 
              ? `<button class="btn-secondary" id="btnCancel">Отмена</button>` 
              : `<button class="btn-secondary" id="btnLater">Позже</button>`}
          </div>
        </div>
      `;

      overlay.classList.add('active');

      const inputName = document.getElementById('inputName');
      const inputSurname = document.getElementById('inputSurname');
      const inputNick = document.getElementById('inputNick');
      const inputBirth = document.getElementById('inputBirth');
      const inputPhone = document.getElementById('inputPhone');
      const btnSave = document.getElementById('btnSave');
      const avatarCircle = document.getElementById('avatarCircle');
      const avatarInput = document.getElementById('avatarInput');
      const loginClose = document.getElementById('loginClose');

      let avatarData = user.avatar || null;

      function autoNick() {
        if (editMode) return;
        if (inputNick.dataset.manual === 'true') return;
        const name = inputName.value.trim();
        const surname = inputSurname.value.trim();
        if (name && surname) {
          inputNick.value = generateNickname(name, surname, inputBirth.value);
        }
      }

      inputName.addEventListener('input', () => { validate(); if (!editMode && !inputNick.value.trim()) autoNick(); });
      inputSurname.addEventListener('input', () => { validate(); if (!editMode && !inputNick.value.trim()) autoNick(); });
      inputBirth.addEventListener('change', () => { if (!editMode && !inputNick.dataset.manual) autoNick(); });
      inputNick.addEventListener('input', () => { inputNick.dataset.manual = 'true'; validate(); });
      inputPhone.addEventListener('input', validate);

      function validate() {
        const ok = inputName.value.trim().length > 0 
                && inputSurname.value.trim().length > 0 
                && inputNick.value.trim().length > 0;
        btnSave.disabled = !ok;
      }
      validate();

      avatarCircle.addEventListener('click', () => avatarInput.click());
      avatarInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          avatarData = ev.target.result;
          avatarCircle.innerHTML = `<img src="${avatarData}" alt="">`;
        };
        reader.readAsDataURL(file);
      });

      btnSave.addEventListener('click', () => {
        const newUser = {
          name: inputName.value.trim(),
          surname: inputSurname.value.trim(),
          nick: inputNick.value.trim(),
          birth: inputBirth.value || '',
          phone: inputPhone.value.trim(),
          avatar: avatarData
        };
        saveUser(newUser);
        closeOverlay();
        if (callback) callback();
      });

      loginClose.addEventListener('click', closeOverlay);

      const btnCancel = document.getElementById('btnCancel');
      const btnLater = document.getElementById('btnLater');
      if (btnCancel) btnCancel.addEventListener('click', closeOverlay);
      if (btnLater) btnLater.addEventListener('click', closeOverlay);
    }

    // --- ПРОФИЛЬ ---
    function showProfile() {
      if (!currentUser) return;

      const age = calculateAge(currentUser.birth);
      const birthDisplay = currentUser.birth 
        ? `${formatDate(currentUser.birth)}${age !== null ? ` (${age} лет)` : ''}` 
        : null;

      overlayContent.innerHTML = `
        <div class="profile-screen">
          <button class="login-close" id="profileClose">✕</button>
          
          <div class="profile-header">
            <div class="profile-avatar">
              ${currentUser.avatar 
                ? `<img src="${currentUser.avatar}" alt="">` 
                : (currentUser.name || '?').charAt(0).toUpperCase()}
            </div>
            <div class="profile-name">${currentUser.name} ${currentUser.surname}</div>
            <div class="profile-nick">@${currentUser.nick}</div>
          </div>

          <div class="profile-info">
            <div class="info-row">
              <span class="label">📅 Дата рождения</span>
              ${birthDisplay 
                ? `<span class="value">${birthDisplay}</span>` 
                : `<span class="link" id="addBirth">Указать</span>`}
            </div>
            <div class="info-row">
              <span class="label">📱 Телефон</span>
              ${currentUser.phone 
                ? `<span class="value">${currentUser.phone}</span>` 
                : `<span class="link" id="addPhone">Указать</span>`}
            </div>
            <div class="info-row">
              <span class="label">🖼️ Аватар</span>
              ${currentUser.avatar 
                ? `<span class="value">Загружен</span>` 
                : `<span class="link" id="addAvatar">Загрузить</span>`}
            </div>
          </div>

          <div class="form-actions">
            <button class="btn-primary" id="btnEdit">✏️ Редактировать профиль</button>
            <button class="btn-secondary" id="btnLogout">🚪 Выйти из профиля</button>
          </div>
        </div>
      `;

      overlay.classList.add('active');

      document.getElementById('profileClose').addEventListener('click', closeOverlay);
      document.getElementById('btnEdit').addEventListener('click', () => {
        closeOverlay();
        setTimeout(() => showLoginForm(null, true), 200);
      });
      document.getElementById('btnLogout').addEventListener('click', () => {
        if (confirm('Выйти из профиля?')) {
          isLoggedIn = false;
          currentUser = null;
          localStorage.removeItem('meet_user');
          updateAuthUI();
          closeOverlay();
        }
      });

      ['addBirth', 'addPhone', 'addAvatar'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('click', () => {
          closeOverlay();
          setTimeout(() => showLoginForm(null, true), 200);
        });
      });
    }

    // --- ОТКРЫТИЕ КАРТОЧКИ ---
    function openCard(type) {
      if (!isLoggedIn) {
        showWarning(() => {
          showLoginForm(() => openCard(type));
        });
        return;
      }

      if (type === 'walk') {
        overlayContent.innerHTML = `
          <div class="expanded-card">
            <button class="expanded-close" id="closeExpanded">✕</button>
            <div class="expanded-icon">🚶</div>
            <div class="expanded-title">Прогуляться</div>
            <div class="expanded-desc">Найди компанию для пешей прогулки.</div>
            <button class="expanded-action" id="actionBtn">👟 Начать прогулку</button>
            <div class="card-tools">
              <h4>📊 Инструменты</h4>
              <div class="tool-row"><span class="label">☀️ Погода</span><span class="value">+18°C, ясно</span></div>
              <div class="tool-row"><span class="label">👥 Людей рядом</span><span class="value">8 человек</span></div>
              <div class="tool-row"><span class="label">📏 Дистанция</span><span class="value">3.5 км</span></div>
            </div>
          </div>
        `;

        overlay.classList.add('active');

        document.getElementById('closeExpanded').addEventListener('click', closeOverlay);
        document.getElementById('actionBtn').addEventListener('click', () => {
          alert(`🚀 Запускаем прогулку, ${currentUser.name}!`);
        });

        return;
      }

      overlayContent.innerHTML = `
        <div class="expanded-card">
          <button class="expanded-close" id="closeExpanded">✕</button>
          <div class="placeholder-content">
            <div class="big-icon">🚧</div>
            <h2>В разработке</h2>
            <p>Скоро здесь появится что-то интересное!</p>
            <button class="expanded-action" id="closePlaceholder">Понятно 🙌</button>
          </div>
        </div>
      `;

      overlay.classList.add('active');

      document.getElementById('closeExpanded').addEventListener('click', closeOverlay);
      document.getElementById('closePlaceholder').addEventListener('click', closeOverlay);
    }

    // --- СОБЫТИЯ ---
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        const type = card.getAttribute('data-card');
        if (type) openCard(type);
      });
    });

    loginBtn.addEventListener('click', () => showLoginForm());
    avatar.addEventListener('click', () => {
      if (isLoggedIn) showProfile();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeOverlay();
    });

    // --- ГЛОБАЛЬНЫЙ ТАП ПО ФОНУ (закрывает любое окно) ---
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeOverlay();
    });

    // --- СТАРТ ---
    loadState();

  })();
</script>
</body>
</html>
