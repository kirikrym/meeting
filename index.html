<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Встреча</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0B0E14;
      --card-bg: #131A23;
      --border: #2A3442;
      --accent: #6C5CE7;
      --accent-light: #A29BFE;
      --text: #FFFFFF;
      --text-muted: #8B95A9;
      --radius: 28px;
      --danger: #FF4D6D;
      --success: #10b981;
      --orange: #FF9F43;
      --soul: #A29BFE;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .app {
      max-width: 100%;
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* --- ШАПКА --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-right { display: flex; align-items: center; gap: 12px; }

    .status-online {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .dot-online {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    .btn-login {
      padding: 6px 18px;
      background: transparent;
      border: 1.5px solid var(--accent);
      border-radius: 30px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-login:active { transform: scale(0.95); background: var(--accent); }

    .avatar {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar:active { transform: scale(0.9); }

    /* --- ОСНОВНОЙ БЛОК --- */
    .main {
      flex: 1;
      padding-top: 20px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .section-title span { color: var(--text-muted); font-weight: 400; font-size: 15px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      width: 100%;
      padding-bottom: 20px;
      overflow-x: hidden;
    }

    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    }
    @media (min-width: 900px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }
    @media (min-width: 1200px) {
      .grid { grid-template-columns: repeat(4, 1fr); gap: 18px; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      min-height: 80px;
      overflow: hidden;
      max-width: 100%;
    }

    .card:active { transform: scale(0.98); }
    .card-icon { font-size: 32px; flex-shrink: 0; line-height: 1; }

    .card-text {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      padding-right: 80px;
    }

    .card h3 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 2px 0 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-badge {
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      flex-shrink: 0;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      white-space: nowrap;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- ОВЕРЛЕЙ --- */
    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .overlay.active { display: flex; animation: overlayFade 0.3s ease; }

    @keyframes overlayFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .expanded-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 36px;
      padding: 32px 28px;
      max-width: 500px;
      width: 100%;
      max-height: 85vh;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .overlay.active .expanded-card { transform: scale(1); }

    .expanded-close {
      position: absolute;
      top: 16px; right: 20px;
      font-size: 28px;
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      transition: 0.2s;
      z-index: 10;
    }

    .expanded-close:active { transform: scale(0.8); color: #fff; }

    .expanded-icon { font-size: 56px; margin-bottom: 8px; }
    .expanded-title { font-size: 28px; font-weight: 700; }
    .expanded-desc { font-size: 16px; color: var(--text-muted); margin: 4px 0 20px 0; }

    .expanded-action {
      padding: 14px 24px;
      background: var(--accent);
      border: none;
      border-radius: 30px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
    }

    .expanded-action:active { transform: scale(0.96); }

    .placeholder-content { text-align: center; padding: 20px 0; }
    .placeholder-content .big-icon { font-size: 64px; margin-bottom: 16px; }
    .placeholder-content h2 { font-size: 24px; margin-bottom: 8px; }
    .placeholder-content p { color: var(--text-muted); font-size: 15px; margin-bottom: 20px; }

    .warning-screen {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 32px 28px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow-x: hidden;
    }

    .overlay.active .warning-screen { transform: scale(1); }

    .warning-icon { font-size: 56px; margin-bottom: 12px; }
    .warning-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .warning-text { font-size: 15px; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
    .warning-actions { display: flex; flex-direction: column; gap: 10px; }

    .login-screen {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 36px;
      padding: 32px 28px;
      max-width: 580px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      -webkit-overflow-scrolling: touch;
    }

    .overlay.active .login-screen { transform: scale(1); }

    .login-close {
      position: absolute;
      top: 16px; right: 20px;
      font-size: 28px;
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      transition: 0.2s;
      z-index: 10;
    }

    .login-close:active { transform: scale(0.8); color: #fff; }

    .login-header { text-align: center; margin-bottom: 24px; }
    .login-header .icon { font-size: 48px; margin-bottom: 8px; }
    .login-header h2 { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .login-header p { color: var(--text-muted); font-size: 14px; }

    .avatar-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .avatar-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.2s;
      overflow: hidden;
      position: relative;
    }

    .avatar-circle:hover { border-color: var(--accent); }
    .avatar-circle:active { transform: scale(0.95); }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .avatar-hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .form-group { margin: 0; min-width: 0; }
    .form-group.full { grid-column: 1 / -1; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group label .optional {
      font-weight: 400;
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.6;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: 0.2s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
    }

    .form-group input:focus { border-color: var(--accent); }
    .form-group input::placeholder { color: var(--text-muted); opacity: 0.5; }
    .form-group input[type="date"] { min-height: 52px; }

    .form-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-primary {
      padding: 16px;
      background: var(--accent);
      border: none;
      border-radius: 16px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-secondary {
      padding: 16px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-secondary:active { background: var(--border); }

    .profile-screen {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 36px;
      padding: 32px 28px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .overlay.active .profile-screen { transform: scale(1); }

    .profile-header { text-align: center; margin-bottom: 24px; }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #fff;
      margin: 0 auto 12px;
      overflow: hidden;
    }

    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .profile-nick { font-size: 15px; color: var(--text-muted); }

    .profile-info {
      margin: 24px 0;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 15px;
    }

    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: var(--text-muted); }
    .info-row .value { font-weight: 500; }

    .info-row .link {
      color: var(--accent-light);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .info-row .link:active { opacity: 0.7; }

    @media (orientation: landscape) and (min-width: 560px) {
      .form-grid { grid-template-columns: 1fr 1fr; }
      .form-group.full { grid-column: 1 / -1; }
    }

    @media (max-width: 400px) {
      .card { padding: 16px; border-radius: 22px; }
      .card-icon { font-size: 28px; }
      .card h3 { font-size: 14px; }
      .card p { font-size: 12px; }
      .card-text { padding-right: 70px; }
      .card-badge { font-size: 9px; padding: 3px 10px; right: 14px; max-width: 70px; }
      .expanded-card { padding: 24px 18px; }
      .expanded-title { font-size: 22px; }
      .expanded-icon { font-size: 44px; }
      .login-screen { padding: 24px 18px; max-width: 100%; }
      .login-header h2 { font-size: 22px; }
      .avatar-circle, .profile-avatar { width: 80px; height: 80px; }
      .profile-name { font-size: 20px; }
      .warning-screen { padding: 24px 18px; }
      .warning-icon { font-size: 44px; }
      .warning-title { font-size: 18px; }
      .warning-text { font-size: 14px; }
      .form-group input { font-size: 15px; padding: 12px 16px; }
    }

    .hidden { display: none !important; }

    /* ============================================================
       ЭКРАН "ПРОГУЛЯТЬСЯ"
       ============================================================ */
    .walk-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: #0B0E14;
      z-index: 900;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
      overflow: hidden;
    }

    .walk-screen.active { transform: translateX(0); }

    .walk-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(19, 26, 35, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #2A3442;
      z-index: 1200;
      position: relative;
      flex-shrink: 0;
    }

    .walk-back {
      background: none;
      border: none;
      color: #A29BFE;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 12px;
      transition: 0.2s;
    }

    .walk-back:active { background: rgba(108, 92, 231, 0.15); }

    .walk-logo {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(135deg, #6C5CE7, #A29BFE);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .walk-avatar {
      width: 36px;
      height: 36px;
      background: #6C5CE7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
      overflow: hidden;
      flex-shrink: 0;
    }

    .walk-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .walk-avatar:active { transform: scale(0.9); }

    .walk-map-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    #walkMap {
      width: 100%;
      height: 100%;
      background: #0B0E14;
      z-index: 0 !important;
    }

    #walkMap .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(1.15) saturate(0.7);
    }

    #walkMap .leaflet-pane { z-index: 1 !important; }
    #walkMap .leaflet-top,
    #walkMap .leaflet-bottom { z-index: 2 !important; }

    .walk-slider {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45vh;
      background: #131A23;
      border-radius: 28px 28px 0 0;
      border-top: 1px solid #2A3442;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7);
      transition: height 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
      z-index: 1100;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .walk-slider.expanded { height: 55vh; }

    .slider-header {
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      padding: 10px 16px 14px;
      border-bottom: 1px solid #2A3442;
      touch-action: none;
    }

    .slider-handle {
      width: 40px;
      height: 4px;
      background: #2A3442;
      border-radius: 4px;
      margin: 0 auto 12px;
      transition: 0.2s;
    }

    .slider-header:hover .slider-handle { background: #6C5CE7; }

    .slider-stats {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 13px;
      color: #8B95A9;
      white-space: nowrap;
      overflow: hidden;
    }

    .stat-item { display: inline-flex; align-items: center; gap: 4px; }
    .stat-item b { color: #fff; font-weight: 600; }
    .stat-sep { color: #4A5568; }

    .slider-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 16px 24px;
      -webkit-overflow-scrolling: touch;
    }

    .carousel-title {
      text-align: center;
      font-size: 12px;
      color: #8B95A9;
      margin: 4px 0 10px;
      letter-spacing: 0.5px;
    }

    .carousel {
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 4px 0;
    }

    .carousel::-webkit-scrollbar { display: none; }

    .carousel-track {
      display: flex;
      gap: 12px;
      padding: 0 calc(50% - 32.5%);
    }

    .carousel-card {
      flex: 0 0 65%;
      scroll-snap-align: center;
      background: #0B0E14;
      border: 1.5px solid #2A3442;
      border-radius: 20px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .carousel-card.centered {
      border-color: #6C5CE7;
      background: rgba(108, 92, 231, 0.08);
      transform: scale(1.02);
    }

    .card-avatar {
      width: 52px;
      height: 52px;
      background: #6C5CE7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      overflow: hidden;
    }

    .card-name { font-size: 15px; font-weight: 600; color: #fff; }
    .card-age { font-size: 12px; color: #8B95A9; }
    .card-dist { font-size: 13px; font-weight: 600; color: #A29BFE; margin-top: 2px; }
    .card-status { font-size: 12px; }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2A3442;
      transition: 0.3s;
    }

    .dot.active {
      background: #6C5CE7;
      width: 18px;
      border-radius: 3px;
    }

    .selected-user {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0 16px;
      border-bottom: 1px solid #2A3442;
      position: relative;
    }

    .selected-avatar {
      width: 56px;
      height: 56px;
      background: #6C5CE7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }

    .selected-info { flex: 1; min-width: 0; }

<script>
  "use strict";

  // ============================================================
  // ЗВУК + ВИБРАЦИЯ
  // ============================================================
  function playNotificationSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [880, 1320].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now + i * 0.12);
        gain.gain.linearRampToValueAtTime(0.15, now + i * 0.12 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.12);
        osc.stop(now + i * 0.12 + 0.4);
      });
    } catch (e) {}
  }

  function vibrate() {
    if (navigator.vibrate) {
      try { navigator.vibrate(200); } catch (e) {}
    }
  }

  // ============================================================
  // ОБЩИЕ УТИЛИТЫ
  // ============================================================
  function calcDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = (deg) => deg * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function formatDistance(m) {
    if (m < 1000) return Math.round(m) + ' м';
    return (m / 1000).toFixed(1) + ' км';
  }

  function formatTime(m) {
    const min = Math.max(1, Math.round(m / 80));
    return '~' + min + ' мин';
  }

  function getTime() {
    const d = new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    return `${h}:${m}`;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  // ============================================================
  // ГЕНЕРАТОР АНОНИМНЫХ НИКНЕЙМОВ
  // ============================================================
  const NICK_ADJ = ['Тихий', 'Ночной', 'Добрый', 'Светлый', 'Тёплый', 'Мягкий', 'Ясный', 'Звёздный', 'Лунный', 'Вольный', 'Спокойный', 'Загадочный'];
  const NICK_NOUN = ['Ветер', 'Кот', 'Дракон', 'Лис', 'Сова', 'Волк', 'Ёж', 'Мишка', 'Заяц', 'Пингвин', 'Тигр', 'Олень'];

  function generateAnonNick() {
    const adj = NICK_ADJ[Math.floor(Math.random() * NICK_ADJ.length)];
    const noun = NICK_NOUN[Math.floor(Math.random() * NICK_NOUN.length)];
    return adj + ' ' + noun;
  }

  // ============================================================
  // МОДУЛЬ "ПРОГУЛЯТЬСЯ"
  // ============================================================
  const walkState = {
    map: null,
    userMarker: null,
    otherMarkers: {},
    routeLine: null,
    currentUser: null,
    onClose: null,
    nearbyUsers: [],
    selectedUserId: null,
    currentIndex: 0,
    userLat: null,
    userLng: null,
    watchId: null,
    sliderState: 'medium',
    requestTimer: null,
    requestTimeout: null,
    requestSecondsLeft: 60,
    requestTarget: null,
    requestCancelled: false,
    bannerTimer: null,
    bannerSecondsLeft: 60,
    bannerUser: null,
    bannerCollapsed: false,
  };

  const MOCK_NAMES = ['Алексей', 'Мария', 'Дмитрий', 'Анна', 'Сергей', 'Ольга', 'Иван', 'Екатерина', 'Максим', 'Юлия'];
  const MOCK_AGES = [22, 25, 28, 30, 32, 27, 35, 24, 29, 31];
  const MOCK_STATUSES = ['online', 'online', 'recent', 'old', 'online'];

  function generateMockUsers(lat, lng) {
    const users = [];
    const count = 6 + Math.floor(Math.random() * 4);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * 2 * Math.PI;
      const distance = 0.002 + Math.random() * 0.008;
      users.push({
        id: 'user_' + i,
        name: MOCK_NAMES[i % MOCK_NAMES.length],
        age: MOCK_AGES[i % MOCK_AGES.length],
        lat: lat + Math.cos(angle) * distance,
        lng: lng + Math.sin(angle) * distance,
        status: MOCK_STATUSES[i % MOCK_STATUSES.length],
      });
    }
    return users;
  }

  function statusIcon(s) {
    if (s === 'online') return '🟢';
    if (s === 'recent') return '🟡';
    return '⚪';
  }

  function getSortedWalkUsers() {
    return walkState.nearbyUsers.slice().sort((a, b) => {
      return calcDistance(walkState.userLat, walkState.userLng, a.lat, a.lng)
           - calcDistance(walkState.userLat, walkState.userLng, b.lat, b.lng);
    });
  }

  function createWalkScreen() {
    const el = document.createElement('div');
    el.className = 'walk-screen';
    el.id = 'walkScreen';
    el.innerHTML = `
      <div class="walk-header">
        <button class="walk-back" id="walkBack">← Назад</button>
        <span class="walk-logo">📍 ПРОГУЛЯТЬСЯ</span>
        <div class="walk-avatar" id="walkAvatar"></div>
      </div>

      <div class="walk-map-wrapper" id="walkMapWrapper">
        <div id="walkMap"></div>
      </div>

      <div class="walk-slider" id="walkSlider">
        <div class="slider-header" id="sliderHeader">
          <div class="slider-handle" id="sliderHandle"></div>
          <div class="slider-stats" id="sliderStats"></div>
        </div>
        <div class="slider-body" id="sliderBody"></div>
      </div>
    `;
    document.body.appendChild(el);
    return el;
  }

  function renderWalkSlider() {
    const stats = document.getElementById('sliderStats');
    const body = document.getElementById('sliderBody');
    const slider = document.getElementById('walkSlider');
    if (!stats || !body || !slider) return;

    slider.classList.remove('expanded');

    if (walkState.selectedUserId) {
      renderWalkSelectedUser();
      return;
    }

    const sorted = getSortedWalkUsers();

    if (sorted.length === 0) {
      stats.innerHTML = `<span class="stat-item">👥 Никого рядом</span>`;
      body.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">😔</div>
          <div class="empty-text">Пока никого нет рядом</div>
          <button class="btn-expand" id="btnExpandRadius">🔍 Расширить радиус поиска</button>
        </div>
      `;
      const b = document.getElementById('btnExpandRadius');
      if (b) b.addEventListener('click', expandWalkRadius);
      return;
    }

    const avgDist = sorted.reduce((sum, u) =>
      sum + calcDistance(walkState.userLat, walkState.userLng, u.lat, u.lng), 0) / sorted.length;

    stats.innerHTML = `
      <span class="stat-item">👥 <b>${sorted.length}</b></span>
      <span class="stat-sep">·</span>
      <span class="stat-item">☀️ +18°C</span>
      <span class="stat-sep">·</span>
      <span class="stat-item">📏 <b>${formatDistance(avgDist)}</b></span>
    `;

    let cardsHtml = '';
    sorted.forEach((u, i) => {
      const d = calcDistance(walkState.userLat, walkState.userLng, u.lat, u.lng);
      cardsHtml += `
        <div class="carousel-card ${i === walkState.currentIndex ? 'centered' : ''}" data-idx="${i}" data-id="${u.id}">
          <div class="card-avatar">${u.name.charAt(0)}</div>
          <div class="card-name">${u.name}</div>
          <div class="card-age">${u.age} лет</div>
          <div class="card-dist">${formatDistance(d)}</div>
          <div class="card-status">${statusIcon(u.status)}</div>
        </div>
      `;
    });

    let dotsHtml = '';
    sorted.forEach((_, i) => {
      dotsHtml += `<span class="dot ${i === walkState.currentIndex ? 'active' : ''}"></span>`;
    });

    body.innerHTML = `
      <div class="carousel-title">─── Кто рядом ───</div>
      <div class="carousel" id="carousel">
        <div class="carousel-track" id="carouselTrack">${cardsHtml}</div>
      </div>
      <div class="carousel-dots" id="carouselDots">${dotsHtml}</div>
    `;

    setupWalkCarousel();
  }

  function setupWalkCarousel() {
    const carousel = document.getElementById('carousel');
    const track = document.getElementById('carouselTrack');
    if (!carousel || !track) return;

    const sorted = getSortedWalkUsers();
    requestAnimationFrame(() => scrollWalkToIndex(walkState.currentIndex, false));

    carousel.addEventListener('scroll', () => {
      const cardWidth = carousel.clientWidth * 0.65 + 12;
      const idx = Math.round(carousel.scrollLeft / cardWidth);
      if (idx !== walkState.currentIndex && idx >= 0 && idx < sorted.length) {
        walkState.currentIndex = idx;
        updateWalkDots();
        const user = sorted[idx];
        if (user) centerWalkMapOn(user.lat, user.lng, false);
      }
    });

    track.querySelectorAll('.carousel-card').forEach(card => {
      card.addEventListener('click', () => {
        const idx = parseInt(card.dataset.idx);
        const user = sorted[idx];
        if (!user) return;

        if (walkState.currentIndex === idx && card.classList.contains('centered')) {
          walkState.selectedUserId = user.id;
          renderWalkSlider();
        } else {
          scrollWalkToIndex(idx, true);
        }
      });
    });
  }

  function scrollWalkToIndex(idx, smooth) {
    const carousel = document.getElementById('carousel');
    const track = document.getElementById('carouselTrack');
    if (!carousel || !track) return;
    const cards = track.querySelectorAll('.carousel-card');
    if (!cards[idx]) return;
    const cardWidth = carousel.clientWidth * 0.65 + 12;
    carousel.scrollTo({ left: idx * cardWidth, behavior: smooth ? 'smooth' : 'auto' });
    cards.forEach((c, i) => c.classList.toggle('centered', i === idx));
    walkState.currentIndex = idx;
    updateWalkDots();
  }

  function updateWalkDots() {
    const dots = document.querySelectorAll('#carouselDots .dot');
    dots.forEach((d, i) => d.classList.toggle('active', i === walkState.currentIndex));
  }

  function renderWalkSelectedUser() {
    const stats = document.getElementById('sliderStats');
    const body = document.getElementById('sliderBody');
    const slider = document.getElementById('walkSlider');
    const user = walkState.nearbyUsers.find(u => u.id === walkState.selectedUserId);
    if (!user || !stats || !body || !slider) return;

    const d = calcDistance(walkState.userLat, walkState.userLng, user.lat, user.lng);

    slider.classList.add('expanded');

    stats.innerHTML = `
      <span class="stat-item">📏 <b>${formatDistance(d)}</b></span>
      <span class="stat-sep">·</span>
      <span class="stat-item">⏱ ${formatTime(d)}</span>
      <span class="stat-sep">·</span>
      <span class="stat-item">☀️ +18°C</span>
    `;

    body.innerHTML = `
      <div class="selected-user">
        <div class="selected-avatar">${user.name.charAt(0)}</div>
        <div class="selected-info">
          <div class="selected-name">${user.name}, ${user.age} лет</div>
          <div class="selected-nick">@${user.name.toLowerCase()}_${user.age}</div>
        </div>
        <button class="selected-close" id="selectedClose">✕</button>
      </div>

      <div class="selected-actions">
        <button class="btn-action btn-chat" id="btnChat">💬 Написать</button>
        <button class="btn-action btn-join" id="btnJoin">👟 Присоединиться</button>
      </div>
    `;

    document.getElementById('selectedClose').addEventListener('click', resetWalkSelection);
    document.getElementById('btnChat').addEventListener('click', () => openChat(user));
    document.getElementById('btnJoin').addEventListener('click', () => sendWalkJoinRequest(user));
  }

  function sendWalkJoinRequest(user) {
    if (walkState.requestTimer) return;

    walkState.requestTarget = user;
    walkState.requestSecondsLeft = 60;
    walkState.requestCancelled = false;

    const stats = document.getElementById('sliderStats');
    const body = document.getElementById('sliderBody');

    stats.innerHTML = `<span class="stat-item">⏳ <b>Ожидаем ответа</b></span>`;

    function renderWaiting() {
      body.innerHTML = `
        <div class="waiting-state">
          <div class="waiting-icon">⏳</div>
          <div class="waiting-title">Ожидаем ответа...</div>
          <div class="waiting-sub">${user.name} получил приглашение</div>
          <div class="waiting-timer" id="waitingTimer">${walkState.requestSecondsLeft} сек</div>
          <button class="btn-cancel" id="btnCancelRequest">❌ Отменить</button>
        </div>
      `;
      document.getElementById('btnCancelRequest').addEventListener('click', cancelWalkJoinRequest);
    }

    renderWaiting();

    walkState.requestTimer = setInterval(() => {
      walkState.requestSecondsLeft--;
      const t = document.getElementById('waitingTimer');
      if (t) t.textContent = walkState.requestSecondsLeft + ' сек';

      if (walkState.requestSecondsLeft <= 0) {
        clearInterval(walkState.requestTimer);
        walkState.requestTimer = null;
        showWalkTimeout(user);
      }
    }, 1000);

    const delay = 5000 + Math.random() * 5000;
    walkState.requestTimeout = setTimeout(() => {
      if (walkState.requestCancelled) return;
      if (walkState.requestTimer) {
        clearInterval(walkState.requestTimer);
        walkState.requestTimer = null;
      }
      const accepted = Math.random() < 0.7;
      if (accepted) showWalkAccepted(user);
      else showWalkDeclined(user);
    }, delay);
  }

  function cancelWalkJoinRequest() {
    walkState.requestCancelled = true;
    if (walkState.requestTimer) { clearInterval(walkState.requestTimer); walkState.requestTimer = null; }
    if (walkState.requestTimeout) { clearTimeout(walkState.requestTimeout); walkState.requestTimeout = null; }
    walkState.requestTarget = null;
    renderWalkSlider();
  }

  function showWalkTimeout(user) {
    const body = document.getElementById('sliderBody');
    body.innerHTML = `
      <div class="result-state">
        <div class="result-icon">⏰</div>
        <div class="result-title">Время вышло</div>
        <div class="result-sub">${user.name} не ответил</div>
        <div class="result-actions">
          <button class="btn-cancel" id="btnBackToList">← Назад к списку</button>
        </div>
      </div>
    `;
    document.getElementById('btnBackToList').addEventListener('click', () => resetWalkSelection());
  }

  function showWalkAccepted(user) {
    const body = document.getElementById('sliderBody');
    const stats = document.getElementById('sliderStats');
    stats.innerHTML = `<span class="stat-item">✅ <b>Принято</b></span>`;
    body.innerHTML = `
      <div class="result-state">
        <div class="result-icon">✅</div>
        <div class="result-title">${user.name} принял!</div>
        <div class="result-sub">Можно начинать прогулку</div>
        <div class="result-actions">
          <button class="btn-cancel" id="btnOpenChat" style="background:#6C5CE7;border:none;color:#fff;">💬 Открыть чат</button>
          <button class="btn-cancel" id="btnBackToList2">← Назад к списку</button>
        </div>
      </div>
    `;
    document.getElementById('btnOpenChat').addEventListener('click', () => openChat(user));
    document.getElementById('btnBackToList2').addEventListener('click', resetWalkSelection);
  }

  function showWalkDeclined(user) {
    const body = document.getElementById('sliderBody');
    const stats = document.getElementById('sliderStats');
    stats.innerHTML = `<span class="stat-item">❌ <b>Отклонено</b></span>`;
    body.innerHTML = `
      <div class="result-state">
        <div class="result-icon">❌</div>
        <div class="result-title">${user.name} не может сейчас</div>
        <div class="result-sub">Попробуй другого человека</div>
        <div class="result-actions">
          <button class="btn-cancel" id="btnBackToList3">← Назад к списку</button>
        </div>
      </div>
    `;
    document.getElementById('btnBackToList3').addEventListener('click', resetWalkSelection);
  }

  function showWalkTestBanner() {
    if (!walkState.nearbyUsers.length) {
      if (walkState.userLat) {
        walkState.nearbyUsers = generateMockUsers(walkState.userLat, walkState.userLng);
      } else {
        alert('Сначала открой карту прогулки');
        return;
      }
    }
    const user = walkState.nearbyUsers[Math.floor(Math.random() * walkState.nearbyUsers.length)];
    showWalkIncomingBanner(user);
  }

  function showWalkIncomingBanner(fromUser) {
    removeWalkBanner();
    const wrapper = document.getElementById('walkMapWrapper');
    if (!wrapper) return;

    const banner = document.createElement('div');
    banner.className = 'notif-banner';
    banner.id = 'notifBanner';
    banner.innerHTML = `
      <div class="notif-banner-header">
        <div class="notif-banner-icon">🚶</div>
        <div class="notif-banner-title">Приглашение на прогулку</div>
      </div>
      <div class="notif-banner-body">
        ${fromUser.name} хочет присоединиться<br>
        📏 ${formatDistance(calcDistance(walkState.userLat, walkState.userLng, fromUser.lat, fromUser.lng))} от вас
      </div>
      <div class="notif-banner-timer" id="bannerTimer">⏱ Осталось: 60 сек</div>
      <div class="notif-banner-actions">
        <button class="notif-btn accept" id="bannerAccept">✅ Принять</button>
        <button class="notif-btn decline" id="bannerDecline">❌ Отклонить</button>
      </div>
    `;
    wrapper.appendChild(banner);
    requestAnimationFrame(() => banner.classList.add('active'));

    playNotificationSound();
    vibrate();

    walkState.bannerUser = fromUser;
    walkState.bannerSecondsLeft = 60;
    walkState.bannerCollapsed = false;

    walkState.bannerTimer = setInterval(() => {
      walkState.bannerSecondsLeft--;
      const t = document.getElementById('bannerTimer');
      const miniT = document.getElementById('miniTimer');
      if (t) t.textContent = '⏱ Осталось: ' + walkState.bannerSecondsLeft + ' сек';
      if (miniT) miniT.textContent = walkState.bannerSecondsLeft + ' сек';
      if (walkState.bannerSecondsLeft <= 0) endWalkBanner();
    }, 1000);

    document.getElementById('bannerAccept').addEventListener('click', () => {
      playNotificationSound();
      alert(`✅ Вы приняли приглашение от ${fromUser.name}`);
      endWalkBanner();
    });

    document.getElementById('bannerDecline').addEventListener('click', () => {
      alert(`❌ Вы отклонили приглашение от ${fromUser.name}`);
      endWalkBanner();
    });

    setupWalkBannerSwipe(banner);
  }

  function setupWalkBannerSwipe(banner) {
    let startY = 0;
    let currentY = 0;
    let isSwiping = false;

    banner.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      currentY = startY;
      isSwiping = true;
      banner.classList.add('swiping');
    }, { passive: true });

    banner.addEventListener('touchmove', (e) => {
      if (!isSwiping) return;
      currentY = e.touches[0].clientY;
      const diff = startY - currentY;
      if (diff > 0) banner.style.transform = `translateY(-${Math.min(diff, 150)}px)`;
    }, { passive: true });

    banner.addEventListener('touchend', () => {
      if (!isSwiping) return;
      isSwiping = false;
      banner.classList.remove('swiping');
      const diff = startY - currentY;
      if (diff > 40) collapseWalkBanner();
      else banner.style.transform = '';
    });
  }

  function collapseWalkBanner() {
    const banner = document.getElementById('notifBanner');
    if (banner) {
      banner.classList.remove('active');
      setTimeout(() => banner.remove(), 350);
    }
    walkState.bannerCollapsed = true;

    const wrapper = document.getElementById('walkMapWrapper');
    if (!wrapper) return;

    const mini = document.createElement('div');
    mini.className = 'notif-mini';
    mini.id = 'notifMini';
    mini.innerHTML = `
      <span class="notif-mini-icon">🚶</span>
      <span class="notif-mini-text">Приглашение от ${walkState.bannerUser.name}</span>
      <span class="notif-mini-timer" id="miniTimer">${walkState.bannerSecondsLeft} сек</span>
    `;
    wrapper.appendChild(mini);
    requestAnimationFrame(() => mini.classList.add('active'));

    mini.addEventListener('click', () => {
      mini.classList.remove('active');
      setTimeout(() => mini.remove(), 350);
      showWalkIncomingBanner(walkState.bannerUser);
    });
  }

  function endWalkBanner() {
    if (walkState.bannerTimer) {
      clearInterval(walkState.bannerTimer);
      walkState.bannerTimer = null;
    }
    removeWalkBanner();
    walkState.bannerUser = null;
    walkState.bannerCollapsed = false;
  }

  function removeWalkBanner() {
    const banner = document.getElementById('notifBanner');
    if (banner) {
      banner.classList.remove('active');
      setTimeout(() => banner.remove(), 350);
    }
    const mini = document.getElementById('notifMini');
    if (mini) {
      mini.classList.remove('active');
      setTimeout(() => mini.remove(), 350);
    }
  }

  function resetWalkSelection() {
    walkState.selectedUserId = null;
    walkState.currentIndex = 0;

    if (walkState.routeLine && walkState.map) {
      walkState.map.removeLayer(walkState.routeLine);
      walkState.routeLine = null;
    }

    if (walkState.requestTimer) { clearInterval(walkState.requestTimer); walkState.requestTimer = null; }
    if (walkState.requestTimeout) { clearTimeout(walkState.requestTimeout); walkState.requestTimeout = null; }
    walkState.requestCancelled = false;
    walkState.requestTarget = null;

    renderWalkSlider();
  }

  function initWalkMap(lat, lng) {
    if (walkState.map) return;

    walkState.map = L.map('walkMap', {
      zoomControl: false,
      attributionControl: false,
    }).setView([lat, lng], 17);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(walkState.map);

    walkState.userMarker = L.circleMarker([lat, lng], {
      radius: 9,
      fillColor: '#4D6CFF',
      color: '#fff',
      weight: 3,
      fillOpacity: 1,
    }).addTo(walkState.map);

    walkState.nearbyUsers.forEach(u => addWalkMarkerFor(u));

    walkState.map.on('click', () => {
      if (walkState.selectedUserId) resetWalkSelection();
    });
  }

  function addWalkMarkerFor(u) {
    const marker = L.circleMarker([u.lat, u.lng], {
      radius: 7,
      fillColor: '#FF6B35',
      color: '#fff',
      weight: 2,
      fillOpacity: 0.9,
    }).addTo(walkState.map);

    marker.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      walkState.selectedUserId = u.id;
      centerWalkMapOn(u.lat, u.lng, true);
      renderWalkSlider();
    });

    walkState.otherMarkers[u.id] = marker;
  }

  function centerWalkMapOn(lat, lng, zoomIn) {
    if (!walkState.map) return;
    walkState.map.setView([lat, lng], zoomIn ? 18 : 17, { animate: true });

    if (walkState.routeLine) {
      walkState.map.removeLayer(walkState.routeLine);
      walkState.routeLine = null;
    }

    if (walkState.userLat && walkState.selectedUserId) {
      walkState.routeLine = L.polyline(
        [[walkState.userLat, walkState.userLng], [lat, lng]],
        { color: '#6C5CE7', weight: 3, dashArray: '8,8', opacity: 0.7 }
      ).addTo(walkState.map);
    }
  }

  function startWalkGeolocation() {
    if (!navigator.geolocation) {
      alert('❌ Браузер не поддерживает геолокацию');
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        walkState.userLat = pos.coords.latitude;
        walkState.userLng = pos.coords.longitude;

        walkState.nearbyUsers = generateMockUsers(walkState.userLat, walkState.userLng);
        initWalkMap(walkState.userLat, walkState.userLng);
        renderWalkSlider();

        walkState.watchId = navigator.geolocation.watchPosition(
          (p) => {
            walkState.userLat = p.coords.latitude;
            walkState.userLng = p.coords.longitude;
            if (walkState.userMarker) {
              walkState.userMarker.setLatLng([walkState.userLat, walkState.userLng]);
            }
          },
          () => {},
          { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
        );
      },
      (err) => {
        alert('⚠️ Не удалось получить геолокацию: ' + err.message);
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  function expandWalkRadius() {
    if (!walkState.userLat) return;
    const extra = [];
    for (let i = 0; i < 5; i++) {
      const angle = Math.random() * 2 * Math.PI;
      const distance = 0.01 + Math.random() * 0.03;
      extra.push({
        id: 'extra_' + i + '_' + Date.now(),
        name: MOCK_NAMES[(i + 3) % MOCK_NAMES.length],
        age: MOCK_AGES[(i + 3) % MOCK_AGES.length],
        lat: walkState.userLat + Math.cos(angle) * distance,
        lng: walkState.userLng + Math.sin(angle) * distance,
        status: 'online',
      });
    }
    walkState.nearbyUsers = walkState.nearbyUsers.concat(extra);
    extra.forEach(u => addWalkMarkerFor(u));
    renderWalkSlider();
  }

  function setupWalkSliderGestures() {
    const slider = document.getElementById('walkSlider');
    const header = document.getElementById('sliderHeader');
    if (!slider || !header) return;

    let startY = 0;
    let startState = null;
    let moved = false;

    const heights = { collapsed: '85px', medium: '45vh' };

    function setState(s) {
      walkState.sliderState = s;
      slider.style.height = heights[s];
    }

    setState('medium');

    header.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      startState = walkState.sliderState;
      moved = false;
    }, { passive: true });

    header.addEventListener('touchmove', (e) => {
      const diff = startY - e.touches[0].clientY;
      if (Math.abs(diff) > 20) moved = true;
      if (startState === 'medium' && diff < -40) setState('collapsed');
      else if (startState === 'collapsed' && diff > 40) setState('medium');
    }, { passive: true });

    header.addEventListener('click', () => {
      if (moved) return;
      if (walkState.sliderState === 'medium') setState('collapsed');
      else setState('medium');
    });
  }

  function openWalkScreen(user, onClose) {
    walkState.currentUser = user;
    walkState.onClose = onClose || null;

    const el = createWalkScreen();
    requestAnimationFrame(() => el.classList.add('active'));

    const av = document.getElementById('walkAvatar');
    if (av) {
      if (user && user.avatar) av.innerHTML = `<img src="${user.avatar}" alt="">`;
      else if (user && user.name) av.textContent = user.name.charAt(0).toUpperCase();
      else av.textContent = '?';
    }

    const back = document.getElementById('walkBack');
    if (back) back.addEventListener('click', closeWalkScreen);

    if (av) av.addEventListener('click', () => alert('👤 Профиль — в разработке'));

    startWalkGeolocation();
    setupWalkSliderGestures();
    document.addEventListener('keydown', walkEscHandler);
  }

  function walkEscHandler(e) {
    if (e.key === 'Escape') closeWalkScreen();
  }

  function closeWalkScreen() {
    const el = document.getElementById('walkScreen');
    if (!el) return;

    if (walkState.requestTimer) { clearInterval(walkState.requestTimer); walkState.requestTimer = null; }
    if (walkState.requestTimeout) { clearTimeout(walkState.requestTimeout); walkState.requestTimeout = null; }
    if (walkState.bannerTimer) { clearInterval(walkState.bannerTimer); walkState.bannerTimer = null; }

    if (walkState.watchId) {
      navigator.geolocation.clearWatch(walkState.watchId);
      walkState.watchId = null;
    }

    if (walkState.map) {
      walkState.map.remove();
      walkState.map = null;
      walkState.userMarker = null;
      walkState.otherMarkers = {};
      walkState.routeLine = null;
    }

    walkState.currentUser = null;
    walkState.nearbyUsers = [];
    walkState.selectedUserId = null;
    walkState.currentIndex = 0;
    walkState.userLat = null;
    walkState.userLng = null;
    walkState.sliderState = 'medium';
    walkState.bannerUser = null;
    walkState.bannerCollapsed = false;

    el.classList.remove('active');
    setTimeout(() => el.remove(), 350);

    document.removeEventListener('keydown', walkEscHandler);

    if (walkState.onClose) {
      walkState.onClose();
      walkState.onClose = null;
    }
  }

  // ============================================================
  // МОДУЛЬ "ОБЕД / КОФЕ"
  // ============================================================
  const lunchState = {
    map: null,
    userMarker: null,
    cafeMarkers: [],
    currentUser: null,
    onClose: null,
    cafes: [],
    lunches: [],
    selectedCafe: null,
    selectedLunch: null,
    userLat: null,
    userLng: null,
    watchId: null,
    sliderState: 'medium',
    radius: 3000,
  };

  const OVERPASS_URLS = [
    'https://overpass.openstreetmap.ru/api/interpreter',
    'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
    'https://overpass-api.de/api/interpreter'
  ];

  const CAFE_TYPES = {
    'cafe': { icon: '☕', label: 'Кофейня' },
    'restaurant': { icon: '🍕', label: 'Ресторан' },
    'fast_food': { icon: '🍔', label: 'Фастфуд' },
    'bar': { icon: '🍺', label: 'Бар' },
    'pub': { icon: '🍻', label: 'Паб' }
  };

  async function fetchCafes(lat, lng, radius) {
    const query = `
      [out:json][timeout:15];
      (
        node["amenity"~"cafe|restaurant|fast_food|bar|pub"](around:${radius},${lat},${lng});
        way["amenity"~"cafe|restaurant|fast_food|bar|pub"](around:${radius},${lat},${lng});
      );
      out center 30;
    `;

    for (const url of OVERPASS_URLS) {
      try {
        const resp = await fetch(url, {
          method: 'POST',
          body: 'data=' + encodeURIComponent(query),
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        });
        if (!resp.ok) continue;
        const data = await resp.json();
        if (data && data.elements) {
          return data.elements.map(el => {
            const lat = el.lat || (el.center && el.center.lat);
            const lng = el.lon || (el.center && el.center.lon);
            const tags = el.tags || {};
            return {
              id: 'cafe_' + el.id,
              name: tags.name || 'Кафе',
              type: tags.amenity || 'cafe',
              lat: lat,
              lng: lng,
              address: [tags['addr:street'], tags['addr:housenumber']].filter(Boolean).join(', '),
            };
          }).filter(c => c.lat && c.lng);
        }
      } catch (e) {
        console.warn('Overpass не ответил:', url, e);
      }
    }
    return null;
  }

  function generateMockCafes(lat, lng) {
    const names = ['Кофе Хауз', 'Шоколадница', 'Пушкин', 'Вареничная', 'Теремок', 'Столовая №1', 'Бургер Кинг', 'KFC', 'Додо Пицца', 'Суши Wok'];
    const types = ['cafe', 'restaurant', 'fast_food'];
    const cafes = [];
    for (let i = 0; i < 8; i++) {
      const angle = Math.random() * 2 * Math.PI;
      const distance = 0.002 + Math.random() * 0.02;
      cafes.push({
        id: 'mock_cafe_' + i,
        name: names[i % names.length],
        type: types[i % types.length],
        lat: lat + Math.cos(angle) * distance,
        lng: lng + Math.sin(angle) * distance,
        address: 'ул. Примерная, ' + (i + 1),
      });
    }
    return cafes;
  }

  function generateMockLunches(cafes) {
    const lunches = [];
    const hosts = ['Алексей', 'Мария', 'Дмитрий', 'Анна', 'Сергей'];
    const count = Math.min(4, cafes.length);
    for (let i = 0; i < count; i++) {
      const cafe = cafes[i];
      const hour = 12 + Math.floor(Math.random() * 3);
      const minute = Math.random() < 0.5 ? '00' : '30';
      lunches.push({
        id: 'lunch_' + i,
        cafeId: cafe.id,
        cafe: cafe,
        host: hosts[i % hosts.length],
        hostAge: 22 + Math.floor(Math.random() * 15),
        time: `${hour}:${minute}`,
        spots: 1 + Math.floor(Math.random() * 3),
        totalSpots: 3,
        payment: Math.random() < 0.5 ? 'split' : 'host',
      });
    }
    return lunches;
  }

    const body = document.getElementById('lunchSliderBody');

      <div class="lunch-loading">
        <div class="lunch-loading-icon">🍔</div>
        <div class="lunch-loading-text">Загружаем кафе рядом с вами...</div>
      </div>

  }

  function renderLunchSlider() {
    const stats = document.getElementById('lunchSliderStats');
    const body = document.getElementById('lunchSliderBody');
    const slider = document.getElementById('lunchSlider');
    if (!stats || !body || !slider) return;

    slider.classList.remove('expanded');

    if (lunchState.selectedCafe) { renderCafeDetails(); return; }
    if (lunchState.selectedLunch) { renderLunchDetails(); return; }

      stats.innerHTML = `<span class="stat-item">🍔 Кафе не найдено</span>`;

      <span class="stat-sep">·</span>

    body.innerHTML = `

      </div>

    document.getElementById('btnCreateLunch').addEventListener('click', () => {
      alert('🚧 Создание обеда — в разработке');
    });

    document.querySelectorAll('.lunch-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.dataset.lunchId;
        const lunch = lunchState.lunches.find(l => l.id === id);

          lunchState.selectedLunch = lunch;
          centerLunchMapOn(lunch.cafe.lat, lunch.cafe.lng, true);
          renderLunchSlider();

  function initLunchMap(lat, lng) {
    if (lunchState.map) return;

    lunchState.map = L.map('lunchMap', {
      zoomControl: false,
      attributionControl: false,
    }).setView([lat, lng], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(lunchState.map);

    lunchState.userMarker = L.circleMarker([lat, lng], {
      radius: 9,
      fillColor: '#4D6CFF',
      color: '#fff',
      weight: 3,
      fillOpacity: 1,
    }).addTo(lunchState.map);

    lunchState.map.on('click', () => {
      if (lunchState.selectedCafe) { lunchState.selectedCafe = null; renderLunchSlider(); }
      if (lunchState.selectedLunch) { lunchState.selectedLunch = null; renderLunchSlider(); }
    });
  }

  function addCafeMarkers() {
    if (!lunchState.map) return;
    lunchState.cafeMarkers.forEach(m => lunchState.map.removeLayer(m));
    lunchState.cafeMarkers = [];

    lunchState.cafes.forEach(cafe => {
      const typeInfo = CAFE_TYPES[cafe.type] || CAFE_TYPES.cafe;
      const icon = L.divIcon({
        className: 'cafe-marker',
        html: `<div class="cafe-marker-inner">${typeInfo.icon}</div>`,
        iconSize: [36, 36],
        iconAnchor: [18, 18],
      });

      const marker = L.marker([cafe.lat, cafe.lng], { icon }).addTo(lunchState.map);
      marker.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        lunchState.selectedCafe = cafe;
        centerLunchMapOn(cafe.lat, cafe.lng, true);
        renderLunchSlider();
      });
      lunchState.cafeMarkers.push(marker);
    });
  }

  function centerLunchMapOn(lat, lng, zoomIn) {
    if (!lunchState.map) return;
    lunchState.map.setView([lat, lng], zoomIn ? 17 : 15, { animate: true });
  }

  async function startLunchGeolocation() {
    if (!navigator.geolocation) {
      alert('❌ Браузер не поддерживает геолокацию');
      return;
    }

    renderLunchLoading();

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        lunchState.userLat = pos.coords.latitude;
        lunchState.userLng = pos.coords.longitude;

        initLunchMap(lunchState.userLat, lunchState.userLng);

        let cafes = await fetchCafes(lunchState.userLat, lunchState.userLng, lunchState.radius);
        if (!cafes || cafes.length === 0) {
          console.warn('Overpass пусто, используем мок');
          cafes = generateMockCafes(lunchState.userLat, lunchState.userLng);
        }
        lunchState.cafes = cafes;
        lunchState.lunches = generateMockLunches(cafes);

        addCafeMarkers();
        renderLunchSlider();

        lunchState.watchId = navigator.geolocation.watchPosition(
          (p) => {
            lunchState.userLat = p.coords.latitude;
            lunchState.userLng = p.coords.longitude;
            if (lunchState.userMarker) {
              lunchState.userMarker.setLatLng([lunchState.userLat, lunchState.userLng]);
            }
          },
          () => {},
          { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
        );
      },
      (err) => {
        alert('⚠️ Не удалось получить геолокацию: ' + err.message);
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  function setupLunchSliderGestures() {
    const slider = document.getElementById('lunchSlider');
    const header = document.getElementById('lunchSliderHeader');
    if (!slider || !header) return;

    let startY = 0;
    let startState = null;
    let moved = false;

    const heights = { collapsed: '85px', medium: '45vh' };

    function setState(s) {
      lunchState.sliderState = s;
      slider.style.height = heights[s];
    }

    setState('medium');

    header.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      startState = lunchState.sliderState;
      moved = false;
    }, { passive: true });

    header.addEventListener('touchmove', (e) => {
      const diff = startY - e.touches[0].clientY;
      if (Math.abs(diff) > 20) moved = true;
      if (startState === 'medium' && diff < -40) setState('collapsed');
      else if (startState === 'collapsed' && diff > 40) setState('medium');
    }, { passive: true });

    header.addEventListener('click', () => {
      if (moved) return;
      if (lunchState.sliderState === 'medium') setState('collapsed');
      else setState('medium');
    });
  }

    function generateNickname(name, surname, birthDate) {
      const translit = {
        'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y',
        'к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f',
        'х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'
      };
      function toLatin(str) {
        return str.toLowerCase().split('').map(ch => translit[ch] || ch).join('').replace(/[^a-z0-9]/g, '');
      }
      const n = toLatin(name) || 'user';
      const s = toLatin(surname) || '';
      if (birthDate) {
        const age = calculateAge(birthDate);
        if (age !== null) return `${n}_${s}_${age}`;
      }
      const random = Math.floor(1000 + Math.random() * 9000);
      return s ? `${n}_${s}_${random}` : `${n}_${random}`;
    }

    function calculateAge(birthDate) {
      if (!birthDate) return null;
      const today = new Date();
      const birth = new Date(birthDate);
      if (isNaN(birth.getTime())) return null;
      let age = today.getFullYear() - birth.getFullYear();
      const m = today.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
      return age >= 0 && age < 120 ? age : null;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      return `${day}.${month}.${d.getFullYear()}`;
    }

    function closeOverlay() {
      overlay.classList.remove('active');
      overlayContent.innerHTML = '';
    }

    function showWarning(callback) {
      overlayContent.innerHTML = `
        <div class="warning-screen">
          <div class="warning-icon">🔒</div>
          <div class="warning-title">Требуется профиль</div>
          <div class="warning-text">
            Чтобы пользоваться этой функцией, нужно заполнить профиль.<br>Это займёт минуту.
          </div>
          <div class="warning-actions">
            <button class="btn-primary" id="warningGo">🚪 Перейти к регистрации</button>
            <button class="btn-secondary" id="warningCancel">Отмена</button>
          </div>
        </div>
      `;
      overlay.classList.add('active');

      document.getElementById('warningGo').addEventListener('click', () => {
        closeOverlay();
        setTimeout(() => {
          if (callback) callback();
          else showLoginForm();
        }, 200);
      });

      document.getElementById('warningCancel').addEventListener('click', closeOverlay);
    }

    function showLoginForm(callback, editMode = false) {
      const user = editMode && currentUser ? currentUser : {};

      overlayContent.innerHTML = `
        <div class="login-screen">
          <button class="login-close" id="loginClose">✕</button>
          <div class="login-header">
            <div class="icon">${editMode ? '✏️' : '🔐'}</div>
            <h2>${editMode ? 'Редактирование' : 'Создайте профиль'}</h2>
            <p>${editMode ? 'Измените свои данные' : 'Заполните основные поля'}</p>
          </div>

          <div class="avatar-upload">
            <div class="avatar-circle" id="avatarCircle">
              ${user.avatar ? `<img src="${user.avatar}" alt="">` : (user.name ? user.name.charAt(0).toUpperCase() : '👤')}
            </div>
            <div class="avatar-hint">Нажмите, чтобы загрузить фото</div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none;">
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label>Имя *</label>
              <input type="text" id="inputName" placeholder="Алексей" maxlength="30" value="${user.name || ''}">
            </div>

            <div class="form-group">
              <label>Фамилия *</label>
              <input type="text" id="inputSurname" placeholder="Иванов" maxlength="30" value="${user.surname || ''}">
            </div>

            <div class="form-group">
              <label>Никнейм *</label>
              <input type="text" id="inputNick" placeholder="alex_ivanov_25" maxlength="40" value="${user.nick || ''}">
            </div>

            <div class="form-group">
              <label>Дата рождения <span class="optional">(необязательно)</span></label>
              <input type="date" id="inputBirth" value="${user.birth || ''}">
            </div>

            <div class="form-group full">
              <label>Телефон <span class="optional">(необязательно)</span></label>
              <input type="tel" id="inputPhone" placeholder="+7 999 123-45-67" maxlength="20" value="${user.phone || ''}">
            </div>
          </div>

          <div class="form-actions">
            <button class="btn-primary" id="btnSave" disabled>${editMode ? 'Сохранить' : 'Войти'}</button>
            ${editMode
              ? `<button class="btn-secondary" id="btnCancel">Отмена</button>`
              : `<button class="btn-secondary" id="btnLater">Позже</button>`}
          </div>
        </div>
      `;

      overlay.classList.add('active');

      const inputName = document.getElementById('inputName');
      const inputSurname = document.getElementById('inputSurname');
      const inputNick = document.getElementById('inputNick');
      const inputBirth = document.getElementById('inputBirth');
      const inputPhone = document.getElementById('inputPhone');
      const btnSave = document.getElementById('btnSave');
      const avatarCircle = document.getElementById('avatarCircle');
      const avatarInput = document.getElementById('avatarInput');
      const loginClose = document.getElementById('loginClose');

      let avatarData = user.avatar || null;

      function autoNick() {
        if (editMode) return;
        if (inputNick.dataset.manual === 'true') return;
        const name = inputName.value.trim();
        const surname = inputSurname.value.trim();
        if (name && surname) inputNick.value = generateNickname(name, surname, inputBirth.value);
      }

      inputName.addEventListener('input', () => { validate(); if (!editMode && !inputNick.value.trim()) autoNick(); });
      inputSurname.addEventListener('input', () => { validate(); if (!editMode && !inputNick.value.trim()) autoNick(); });
      inputBirth.addEventListener('change', () => { if (!editMode && !inputNick.dataset.manual) autoNick(); });
      inputNick.addEventListener('input', () => { inputNick.dataset.manual = 'true'; validate(); });
      inputPhone.addEventListener('input', validate);

      function validate() {
        const ok = inputName.value.trim().length > 0 && inputSurname.value.trim().length > 0 && inputNick.value.trim().length > 0;
        btnSave.disabled = !ok;
      }
      validate();

      avatarCircle.addEventListener('click', () => avatarInput.click());
      avatarInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          avatarData = ev.target.result;
          avatarCircle.innerHTML = `<img src="${avatarData}" alt="">`;
        };
        reader.readAsDataURL(file);
      });

      btnSave.addEventListener('click', () => {
        const newUser = {
          name: inputName.value.trim(),
          surname: inputSurname.value.trim(),
          nick: inputNick.value.trim(),
          birth: inputBirth.value || '',
          phone: inputPhone.value.trim(),
          avatar: avatarData
        };
        saveUser(newUser);
        closeOverlay();
        if (callback) callback();
      });

      loginClose.addEventListener('click', closeOverlay);

      const btnCancel = document.getElementById('btnCancel');
      const btnLater = document.getElementById('btnLater');
      if (btnCancel) btnCancel.addEventListener('click', closeOverlay);
      if (btnLater) btnLater.addEventListener('click', closeOverlay);
    }

    function showProfile() {
      if (!currentUser) return;
      const age = calculateAge(currentUser.birth);
      const birthDisplay = currentUser.birth
        ? `${formatDate(currentUser.birth)}${age !== null ? ` (${age} лет)` : ''}`
        : null;

      overlayContent.innerHTML = `
        <div class="profile-screen">
          <button class="login-close" id="profileClose">✕</button>

          <div class="profile-header">
            <div class="profile-avatar">
              ${currentUser.avatar ? `<img src="${currentUser.avatar}" alt="">` : (currentUser.name || '?').charAt(0).toUpperCase()}
            </div>
            <div class="profile-name">${currentUser.name} ${currentUser.surname}</div>
            <div class="profile-nick">@${currentUser.nick}</div>
          </div>

          <div class="profile-info">
            <div class="info-row">
              <span class="label">📅 Дата рождения</span>
              ${birthDisplay ? `<span class="value">${birthDisplay}</span>` : `<span class="link" id="addBirth">Указать</span>`}
            </div>
            <div class="info-row">
              <span class="label">📱 Телефон</span>
              ${currentUser.phone ? `<span class="value">${currentUser.phone}</span>` : `<span class="link" id="addPhone">Указать</span>`}
            </div>
            <div class="info-row">
              <span class="label">🖼️ Аватар</span>
              ${currentUser.avatar ? `<span class="value">Загружен</span>` : `<span class="link" id="addAvatar">Загрузить</span>`}
            </div>
          </div>

          <div class="form-actions">
            <button class="btn-primary" id="btnEdit">✏️ Редактировать профиль</button>
            <button class="btn-secondary" id="btnLogout">🚪 Выйти из профиля</button>
            <button class="btn-secondary" id="btnTestNotif" style="border-color:#6C5CE7;color:#A29BFE;">🔔 Тест уведомления</button>
          </div>
        </div>
      `;

      overlay.classList.add('active');

      document.getElementById('profileClose').addEventListener('click', closeOverlay);
      document.getElementById('btnEdit').addEventListener('click', () => {
        closeOverlay();
        setTimeout(() => showLoginForm(null, true), 200);
      });
      document.getElementById('btnLogout').addEventListener('click', () => {
        if (confirm('Выйти из профиля?')) {
          isLoggedIn = false;
          currentUser = null;
          localStorage.removeItem('meet_user');
          updateAuthUI();
          closeOverlay();
        }
      });

      document.getElementById('btnTestNotif').addEventListener('click', () => {
        closeOverlay();
        setTimeout(() => {
          openWalkScreen(currentUser);
          let attempts = 0;
          const checkInterval = setInterval(() => {
            attempts++;
            if (walkState.userLat && walkState.nearbyUsers.length > 0) {
              clearInterval(checkInterval);
              showWalkTestBanner();
            }
            if (attempts > 30) clearInterval(checkInterval);
          }, 300);
        }, 200);
      });

      ['addBirth', 'addPhone', 'addAvatar'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('click', () => {
          closeOverlay();
          setTimeout(() => showLoginForm(null, true), 200);
        });
      });
    }

    function openCard(type) {
      if (!isLoggedIn) {
        showWarning(() => showLoginForm(() => openCard(type)));
        return;
      }

      if (type === 'walk') { openWalkScreen(currentUser); return; }
      if (type === 'lunch') { openLunchScreen(currentUser); return; }
      if (type === 'soul') { openSoulScreen(currentUser); return; }

      overlayContent.innerHTML = `
        <div class="expanded-card">
          <button class="expanded-close" id="closeExpanded">✕</button>
          <div class="placeholder-content">
            <div class="big-icon">🚧</div>
            <h2>В разработке</h2>
            <p>Скоро здесь появится что-то интересное!</p>
            <button class="expanded-action" id="closePlaceholder">Понятно 🙌</button>
          </div>
        </div>
      `;

      overlay.classList.add('active');

      document.getElementById('closeExpanded').addEventListener('click', closeOverlay);
      document.getElementById('closePlaceholder').addEventListener('click', closeOverlay);
    }

    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        const type = card.getAttribute('data-card');
        if (type) openCard(type);
      });
    });

    loginBtn.addEventListener('click', () => showLoginForm());
    avatar.addEventListener('click', () => {
      if (isLoggedIn) showProfile();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeOverlay();
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeOverlay();
    });

    loadState();
  })();
</script>
</body>
</html>
