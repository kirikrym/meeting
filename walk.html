<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Прогулка — Встреча</title>

  <!-- Leaflet (карта) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0B0E14;
      --card-bg: #131A23;
      --border: #2A3442;
      --accent: #6C5CE7;
      --accent-light: #A29BFE;
      --text: #FFFFFF;
      --text-muted: #8B95A9;
      --danger: #FF4D6D;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* --- ШАПКА (с кнопкой назад) --- */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg);
      z-index: 10;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--text);
      font-size: 28px;
      cursor: pointer;
      padding: 4px 8px;
      transition: 0.2s;
    }

    .btn-back:active { transform: scale(0.85); }

    .header-title {
      font-size: 18px;
      font-weight: 600;
    }

    .header-user {
      margin-left: auto;
      font-size: 14px;
      color: var(--text-muted);
    }

    /* --- КАРТА (занимает всё место) --- */
    #mapContainer {
      flex: 1;
      position: relative;
      background: #0B0E14;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* --- КНОПКА СОЗДАТЬ ПРОГУЛКУ (поверх карты) --- */
    .btn-start-walk {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 32px;
      background: var(--accent);
      border: none;
      border-radius: 30px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(108, 92, 231, 0.4);
      transition: 0.2s;
      z-index: 20;
      white-space: nowrap;
    }

    .btn-start-walk:active { transform: translateX(-50%) scale(0.95); }

    .btn-start-walk.active {
      background: #10b981;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
    }

    /* --- СТАТУС-БАР (таймер, кол-во людей) --- */
    .status-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 20px;
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 20;
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    .status-bar .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
    }

    .status-bar .count {
      color: var(--text);
      font-weight: 600;
    }

    /* --- АДАПТИВ --- */
    @media (max-width: 400px) {
      .btn-start-walk { font-size: 15px; padding: 12px 24px; bottom: 20px; }
      .status-bar { font-size: 12px; padding: 6px 14px; top: 8px; gap: 10px; }
      .header-title { font-size: 16px; }
    }
  </style>
</head>
<body>

<!-- ШАПКА -->
<header class="header">
  <button class="btn-back" id="backBtn">←</button>
  <span class="header-title">🚶 Прогулка</span>
  <span class="header-user" id="userNameDisplay">👤</span>
</header>

<!-- КАРТА -->
<div id="mapContainer">
  <div id="map"></div>

  <!-- Статус-бар -->
  <div class="status-bar" id="statusBar">
    <span class="dot"></span>
    <span>Активна: <span id="timerDisplay">00:00</span></span>
    <span>•</span>
    <span>👥 <span class="count" id="peopleCount">0</span></span>
  </div>

  <!-- Кнопка создания прогулки -->
  <button class="btn-start-walk" id="startWalkBtn">🚀 Создать прогулку</button>
</div>

<script>
  (function() {
    "use strict";

    // --- ИМЯ ПОЛЬЗОВАТЕЛЯ ---
    const userName = localStorage.getItem('meet_user') || 'Гость';
    document.getElementById('userNameDisplay').textContent = '👤 ' + userName;

    // --- КНОПКА НАЗАД ---
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // --- КАРТА (ночной режим) ---
    const map = L.map('map', {
      center: [55.7558, 37.6173], // Москва (заглушка)
      zoom: 15,
      zoomControl: false,
      attributionControl: false
    });

    // Тёмный слой (Ночной режим)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap, © CartoDB',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // --- ГЕОЛОКАЦИЯ ---
    let userMarker = null;
    let userCircle = null;
    let isWalkActive = false;
    let timerInterval = null;
    let seconds = 0;

    // Пульсирующая метка (кастомная)
    function createPulsingIcon() {
      return L.divIcon({
        className: 'pulsing-marker',
        html: `
          <div style="
            width: 20px;
            height: 20px;
            background: #6C5CE7;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.8);
            animation: pulse-marker 1.5s infinite ease-in-out;
          "></div>
          <style>
            @keyframes pulse-marker {
              0% { transform: scale(1); opacity: 1; }
              50% { transform: scale(1.4); opacity: 0.7; }
              100% { transform: scale(1); opacity: 1; }
            }
          </style>
        `,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
    }

    // --- ЗАПРОС ГЕОЛОКАЦИИ ---
    function locateUser() {
      if (!navigator.geolocation) {
        alert('❌ Ваш браузер не поддерживает геолокацию');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          map.setView([lat, lng], 16);

          // Метка пользователя (пульсирующая)
          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker([lat, lng], { icon: createPulsingIcon() }).addTo(map);
          userMarker.bindPopup('📍 Вы здесь');

          // Круг радиуса (для красоты)
          if (userCircle) map.removeLayer(userCircle);
          userCircle = L.circle([lat, lng], {
            radius: 50,
            color: '#6C5CE7',
            fillColor: '#6C5CE7',
            fillOpacity: 0.15,
            weight: 1
          }).addTo(map);

          // Обновляем счётчик людей (заглушка)
          document.getElementById('peopleCount').textContent = '3';
        },
        (err) => {
          alert('⚠️ Ошибка GPS: ' + err.message + '\n\nПроверьте доступ к геолокации.');
          // Показываем Москву как заглушку
          map.setView([55.7558, 37.6173], 13);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // --- ТАЙМЕР ---
    function startTimer() {
      seconds = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    // --- КНОПКА "СОЗДАТЬ ПРОГУЛКУ" ---
    const startBtn = document.getElementById('startWalkBtn');
    const statusBar = document.getElementById('statusBar');

    startBtn.addEventListener('click', () => {
      isWalkActive = !isWalkActive;

      if (isWalkActive) {
        startBtn.textContent = '⏹ Завершить прогулку';
        startBtn.classList.add('active');
        statusBar.style.borderColor = '#10b981';
        startTimer();

        // Вибрация (если поддерживается)
        if (navigator.vibrate) {
          navigator.vibrate(50);
        }

        // Заглушка: показываем уведомление
        alert('🚀 Вы создали прогулку! Ваша метка видна другим пользователям.');

        // Обновляем счётчик людей (заглушка)
        document.getElementById('peopleCount').textContent = '5';

      } else {
        startBtn.textContent = '🚀 Создать прогулку';
        startBtn.classList.remove('active');
        statusBar.style.borderColor = 'var(--border)';
        stopTimer();
        document.getElementById('timerDisplay').textContent = '00:00';

        // Заглушка
        alert('⏹ Прогулка завершена.');

        // Обновляем счётчик людей (заглушка)
        document.getElementById('peopleCount').textContent = '3';
      }
    });

    // --- ЗАПУСК ---
    locateUser();

    // --- ОБНОВЛЕНИЕ ГЕОЛОКАЦИИ ПРИ ДВИЖЕНИИ (если прогулка активна) ---
    let watchId = null;

    function startWatching() {
      if (watchId) return;
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          if (userMarker) {
            userMarker.setLatLng([lat, lng]);
          }
          if (userCircle) {
            userCircle.setLatLng([lat, lng]);
          }
        },
        (err) => {
          console.warn('Ошибка обновления GPS:', err.message);
        },
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
      );
    }

    function stopWatching() {
      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
    }

    // Автоматически запускаем слежение при старте
    startWatching();

    // Если прогулка активна — следим, если нет — не обновляем метку (но для демо оставляем)
    // Пока следим всегда, чтобы метка двигалась

    // --- ЗАКРЫТИЕ СТРАНИЦЫ (очистка) ---
    window.addEventListener('beforeunload', () => {
      stopWatching();
      stopTimer();
    });

  })();
</script>
</body>
</html>
